<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객안내문 FCO Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f0ec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-wash: #cde2fb;
  --done: #2a78d6;
  --todo: #d03b3b;
  --band-r: #d03b3b;
  --band-o: #fab219;
  --band-g: #0ca30c;
  --band-n: #898781;
  --ok-text: #006300;
  --bad-text: #b42323;
  --warn-bg: #fff6e0;
  --warn-ink: #6b4b00;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #252523;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-wash: #104281;
    --done: #3987e5;
    --ok-text: #0ca30c;
    --bad-text: #e66767;
    --warn-bg: #2e2510;
    --warn-ink: #f3d58a;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #252523;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-wash: #104281;
  --done: #3987e5;
  --ok-text: #0ca30c;
  --bad-text: #e66767;
  --warn-bg: #2e2510;
  --warn-ink: #f3d58a;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
@media (max-width: 640px) { .wrap { padding-left: 16px; padding-right: 16px; } }

/* ---------- header ---------- */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 18px; padding-bottom: 10px; }
.top h1 { font-size: 20px; line-height: 1.3; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.meta { margin: 4px 0 0; color: var(--ink-2); font-size: 12.5px; }
.top-actions { display: flex; gap: 6px; flex-shrink: 0; }
.banner { margin-top: 4px; margin-bottom: 8px; }
.banner > div { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.banner > div + div { margin-top: 6px; }

/* ---------- filters + tabs ---------- */
.sticky { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--border); }
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; padding-top: 8px; padding-bottom: 8px; }
.f { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-2); min-width: 0; }
.f.grow { flex: 1 1 220px; }
.f select, .f input {
  height: 34px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 0 10px; min-width: 150px; max-width: 100%; font-size: 14px; color: var(--ink);
}
.f.grow input { width: 100%; }
.f input[type="checkbox"] { width: 16px; height: 16px; min-width: 0; padding: 0; margin: 0; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; height: 34px; color: var(--ink); font-size: 13.5px; cursor: pointer; }
.muted { color: var(--ink-2); font-weight: 400; }
.f select:focus-visible, .f input:focus-visible, .btn:focus-visible, .tab:focus-visible, [tabindex]:focus-visible, .seg-btn:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.btn {
  height: 34px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 0 12px;
  cursor: pointer; white-space: nowrap; font-size: 13px;
}
.btn:hover { background: var(--surface-2); }
.btn.ghost { background: transparent; }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: transparent; padding: 10px 14px 9px; cursor: pointer; white-space: nowrap; font-size: 14px;
  color: var(--ink-2); border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
.tab .cnt { font-weight: 400; color: var(--muted); margin-left: 4px; font-size: 12px; }
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-bottom: 8px; font-size: 12.5px; color: var(--ink-2); }
.active-filters:empty { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12.5px; color: var(--ink);
}
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--ink-2); padding: 0 6px; font-size: 14px; line-height: 1; }

/* ---------- layout ---------- */
main { padding-top: 16px; padding-bottom: 40px; }
.section-title { font-size: 15px; font-weight: 700; margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.section-title:first-child { margin-top: 0; }
.section-title .hint { font-weight: 400; color: var(--ink-2); font-size: 12.5px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px; margin-top: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 700; }
.card .sub { margin: 0 0 12px; color: var(--ink-2); font-size: 12.5px; }
.subfilters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; margin-bottom: 14px; }
.empty { color: var(--ink-2); padding: 18px 4px; font-size: 13px; }
.note { color: var(--ink-2); font-size: 12.5px; margin: 8px 0 0; }

/* ---------- KPI tiles ---------- */
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: left;
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
button.kpi { cursor: pointer; }
button.kpi:hover { background: var(--surface-2); }
.kpi.active { outline: 2px solid var(--accent); outline-offset: -1px; }
.kpi-label { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.kpi-value { font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
.kpi-sub { font-size: 12.5px; color: var(--ink-2); }
.kpi.hero { grid-column: span 2; }
.kpi.hero .kpi-value { font-size: 48px; line-height: 1.1; }
@media (max-width: 520px) { .kpi.hero { grid-column: span 1; } }
.meter { height: 8px; background: var(--accent-wash); border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
.meter > span { display: block; height: 100%; background: var(--done); border-radius: 0 4px 4px 0; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }

/* ---------- legends ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- bar lists ---------- */
.bars { display: flex; flex-direction: column; gap: 2px; }
.bar-row {
  display: grid; grid-template-columns: minmax(70px, 32%) minmax(60px, 1fr) auto; align-items: center; gap: 10px;
  padding: 5px 6px; border-radius: 6px; cursor: pointer;
}
.bar-row:hover, .bar-row:focus-visible { background: var(--surface-2); }
.bar-row.active { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.bar-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.track { display: flex; gap: 2px; height: 14px; }
.track-wrap { min-width: 0; }
.seg { height: 100%; min-width: 3px; }
.seg:last-child { border-radius: 0 4px 4px 0; }
.seg.done { background: var(--done); }
.seg.todo { background: var(--todo); }
.seg.r { background: var(--band-r); }
.seg.o { background: var(--band-o); }
.seg.g { background: var(--band-g); }
.seg.n { background: var(--band-n); }
.bar-val { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; min-width: 92px; }
.bar-val b { color: var(--ink); font-weight: 700; }
.bar-val .okmark { color: var(--ok-text); font-weight: 700; }
.more { margin-top: 6px; }
.linkbtn { border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 4px 6px; font-size: 12.5px; }
.linkbtn:hover { text-decoration: underline; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; white-space: nowrap; color: var(--ink); }
.badge + .badge { margin-left: 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.ok { color: var(--ok-text); font-weight: 600; }
.bad { color: var(--bad-text); font-weight: 600; }

/* ---------- tables ---------- */
.table-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
.table-tools .count { color: var(--ink-2); font-size: 12.5px; margin-right: auto; }
.seg-ctl { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg-btn { border: 0; background: transparent; padding: 0 12px; height: 30px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.seg-btn + .seg-btn { border-left: 1px solid var(--border); }
.seg-btn[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 700; }
.tbl-wrap { overflow: auto; max-height: 72vh; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
th {
  position: sticky; top: 0; background: var(--surface-2); font-weight: 600; font-size: 12.5px; color: var(--ink-2);
  white-space: nowrap; cursor: pointer; user-select: none; z-index: 1;
}
th:hover { color: var(--ink); }
th .arr { color: var(--accent); margin-left: 3px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td { white-space: nowrap; }
td.clip { white-space: normal; min-width: 160px; max-width: 320px; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.clickable { cursor: pointer; }
td a.hlink, td button.hlink { color: var(--ink); text-decoration: none; font-weight: 600; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
td button.hlink:hover { color: var(--accent); text-decoration: underline; }
.table-more { text-align: center; padding: 8px; }

/* ---------- hospital view ---------- */
.hosp-layout { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .hosp-layout { grid-template-columns: minmax(0, 1fr); } }
.hosp-layout > * { min-width: 0; }
.hlist { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.hlist-head { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.hlist-items { max-height: 70vh; overflow: auto; }
.hitem {
  display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--grid); background: transparent;
  padding: 9px 12px; cursor: pointer;
}
.hitem:hover { background: var(--surface-2); }
.hitem[aria-current="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.hitem .nm { font-weight: 600; font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hitem .pp { color: var(--ink-2); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hitem .bd { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 3px; }
.hdetail .card + .card { margin-top: 12px; }
.hdetail h2 { margin: 0; font-size: 19px; }
.hdetail .aliases { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.mini-kpis { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 12px; }
.mini-kpis div { display: flex; flex-direction: column; }
.mini-kpis .l { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.mini-kpis .v { font-size: 22px; font-weight: 700; }

/* ---------- info ---------- */
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }
.warnlist { margin: 0; padding-left: 18px; color: var(--warn-ink); }
.foot { color: var(--muted); font-size: 12px; padding-bottom: 24px; }

/* ---------- tooltip ---------- */
.tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12.5px;
  min-width: 140px; max-width: 320px;
}
.tip .tt { font-weight: 600; margin-bottom: 4px; color: var(--ink-2); }
.tip .tr { display: grid; grid-template-columns: 12px auto 1fr; align-items: center; gap: 6px; }
.tip .key { width: 12px; height: 3px; border-radius: 2px; }
.tip .tv { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.tip .tl { color: var(--ink-2); }

@media print {
  .sticky, .top-actions, .table-tools .btn, .linkbtn, .hlist { display: none !important; }
  .hosp-layout { grid-template-columns: 1fr; }
  .tbl-wrap { max-height: none; overflow: visible; }
  body { background: #fff; }
}
@media (forced-colors: active) {
  .seg, .meter > span, .sw, .dot { forced-color-adjust: none; }
}
</style>
</head>
<body>
<header class="top wrap">
  <div>
    <h1>고객안내문 · FCO 통합 Dashboard</h1>
    <p class="meta" id="metaLine"></p>
  </div>
  <div class="top-actions">
    <button class="btn ghost" id="themeBtn" type="button" title="화면 밝기 바꾸기"></button>
    <button class="btn ghost" type="button" onclick="window.print()">인쇄</button>
  </div>
</header>
<div class="wrap banner" id="banner"></div>
<div class="sticky">
  <div class="wrap filters">
    <label class="f"><span>담당자 (FSE · 영업)</span><select id="fPerson"></select></label>
    <label class="f"><span>장비</span><select id="fMod"></select></label>
    <label class="f" id="fBuWrap"><span>BU</span><select id="fBu"></select></label>
    <label class="f grow"><span>검색</span><input id="fQ" type="search" placeholder="병원명 · S/N · FSN · C&amp;R · FCO 번호" autocomplete="off"></label>
    <button class="btn" id="fReset" type="button">필터 초기화</button>
  </div>
  <div class="wrap active-filters" id="activeFilters"></div>
  <nav class="wrap tabs" role="tablist" id="tabs" aria-label="화면 선택"></nav>
</div>
<main class="wrap" id="main"></main>
<footer class="wrap foot" id="foot"></footer>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
<script>
(function () {
'use strict';

/* ======================= data ======================= */
const D = JSON.parse(document.getElementById('dashboard-data').textContent);
const FSN = (D.fsn && D.fsn.rows) || [];
const FCO = (D.fco && D.fco.rows) || [];
const H = D.hospitals || {};
const FSN_OK = !!(D.fsn && D.fsn.available);
const FCO_OK = !!(D.fco && D.fco.available);

const BAND = {
  r: { label: '6개월 미만', color: 'var(--band-r)' },
  o: { label: '1년 미만', color: 'var(--band-o)' },
  g: { label: '1년 이상', color: 'var(--band-g)' },
  n: { label: '기한 없음', color: 'var(--band-n)' },
};
const BAND_KEYS = ['r', 'o', 'g', 'n'];
const HAS_BAND_N = FCO.some(r => r.b === 'n');
const BU_ALIAS = {
  'MR': ['MR', 'MRI'],
  'XR': ['XR', 'DXR', 'X-RAY', 'XRAY', 'DR'],
  'CT/AMI': ['CT', 'AMI', 'CT/AMI', 'CT-AMI', 'CTAMI', 'CT_AMI', 'NM', 'PET'],
};

const splitPeople = s => (s ? String(s).split(/[,/;\n·&+]|\s{2,}/).map(x => x.trim().replace(/^[()[\]]+|[()[\]]+$/g, '')).filter(x => x && x !== '-' && x !== '?') : []);
FSN.forEach(r => { r._fse = splitPeople(r.fse); r._sales = splitPeople(r.sales); if (!r.pp) r.pp = r._fse.concat(r._sales); });
FCO.forEach(r => { if (!r.pp) r.pp = splitPeople(r.fse); });

const FSN_PEOPLE = new Set(FSN.flatMap(r => r.pp));
const FCO_PEOPLE = new Set(FCO.flatMap(r => r.pp));
const has = (rows, k) => rows.some(r => r[k] !== undefined && r[k] !== null && r[k] !== '');
const FSN_HAS = {};
['bu', 'cr', 'fsn', 'ft', 'fco', 'm', 'd', 'rp', 'fse', 'sales', 'sn', 'sys', 'site', 'rg', 'rm', 'sr'].forEach(k => FSN_HAS[k] = has(FSN, k));
const hname = k => (H[k] && H[k].name) || k;
/* BU(지역 묶음)와 전달방법은 아직 정확한 정보가 없어 화면에서 숨김 (2026-10-23 사용자 요청).
   나중에 BU별 지역 목록을 받으면 SHOW_BU = true 로 바꾸고 지역 매핑을 추가합니다. */
const SHOW_BU = false;
const SHOW_METHOD = false;
const methodLabel = r => r.m || '미지정';
const buLabel = r => r.bu || '(BU 없음)';
const crLabel = r => r.cr || '(C&R 없음)';
const fsnLabel = r => r.fsn || '(FSN 없음)';

/* ======================= state ======================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem('fsnDash.' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fsnDash.' + k, v); } catch (e) { /* 무시 */ } },
};
const S = {
  tab: store.get('tab', 'overview'),
  person: '', bu: '', mod: '', q: '',
  cr: '', method: '', fsnId: '', fsnView: 'hosp', fsnOnly: 'todo',
  src: '', band: '', rel: false,
  hsel: null, hsort: 'prio', hOnly: '',
  expand: {}, tables: {},
};

/* ======================= helpers ======================= */
function h(tag, attrs) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  for (let i = 2; i < arguments.length; i++) append(e, arguments[i]);
  return e;
}
function setKids(e) { e.replaceChildren(); for (let i = 1; i < arguments.length; i++) append(e, arguments[i]); }
function append(e, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(x => append(e, x)); return; }
  e.append(c instanceof Node ? c : document.createTextNode(String(c)));
}
const fmt = n => (n == null ? '-' : Number(n).toLocaleString('ko-KR'));
function pct(done, total) {
  if (!total) return 0;
  let p = Math.round(done / total * 100);
  if (p === 100 && done < total) p = 99;
  if (p === 0 && done > 0) p = 1;
  return p;
}
const sw = color => h('span', { class: 'sw', style: 'background:' + color });
const dot = color => h('span', { class: 'dot', style: 'background:' + color });
function uniqSorted(arr) {
  return Array.from(new Set(arr.filter(x => x))).sort((a, b) => a.localeCompare(b, 'ko'));
}
function ddayText(dd) {
  if (dd == null) return '';
  if (dd === 0) return 'D-day';

  if (D.sample) banners.push('샘플 데이터로 만든 화면입니다. 실제 데이터가 아닙니다.');
  if (D.fsn && D.fsn.file && D.fsn.file.stale) banners.push('⚠ 고객안내문 파일을 새로 받지 못해 ' + D.fsn.file.time + ' 파일로 보여줍니다.');
  if (D.people && D.people.available && D.people.file && D.people.file.stale) banners.push('⚠ 담당자 파일(PM Planning)은 ' + D.people.file.time + ' 파일입니다 (오늘 받은 파일 아님).');
  (D.fco.sources || []).filter(s => s.ok && s.file && s.file.stale).forEach(s => banners.push('⚠ FCO ' + s.name + '은(는) ' + s.file.time + ' 파일입니다 (오늘 받은 파일 아님).'));
  if (D.fsn && D.fsn.warnings && D.fsn.warnings.length) banners.push('ⓘ 고객안내문 읽기 참고사항 ' + D.fsn.warnings.length + '개 — 데이터 정보 탭 확인');
  setKids(document.getElementById('banner'), banners.map(b => h('div', { text: b })));
  document.getElementById('foot').textContent = (D.app || '') + ' v' + (D.version || '') + ' · 생성 ' + D.generated;
}

/* theme */
const THEMES = [['auto', '화면: 자동'], ['light', '화면: 밝게'], ['dark', '화면: 어둡게']];
function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = (THEMES.find(x => x[0] === t) || THEMES[0])[1];
}
let theme = store.get('theme', 'auto');
applyTheme(theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const i = THEMES.findIndex(x => x[0] === theme);
  theme = THEMES[(i + 1) % THEMES.length][0];
  store.set('theme', theme);
  applyTheme(theme);
});

/* global filter events */
document.getElementById('fPerson').addEventListener('change', e => { S.person = e.target.value; render(); });
document.getElementById('fBu').addEventListener('change', e => { S.bu = e.target.value; render(); });
document.getElementById('fMod').addEventListener('change', e => { S.mod = e.target.value; render(); });
let qTimer = null;
document.getElementById('fQ').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 200);
});
document.getElementById('fReset').addEventListener('click', () => {
  Object.assign(S, { person: '', bu: '', mod: '', q: '', cr: '', method: '', fsnId: '', src: '', band: '', rel: false, hOnly: '' });
  render();
});

renderHeader();
render();
})();
</script>
